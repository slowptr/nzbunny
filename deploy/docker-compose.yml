services:
  nzbunny:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nzbunny
    environment:
      PORT: "1337"
      NNTP_HOST: ${NNTP_HOST:?Set NNTP_HOST in your environment}
      NNTP_PORT: ${NNTP_PORT:-563}
      NNTP_USER: ${NNTP_USER:?Set NNTP_USER in your environment}
      NNTP_PASS: ${NNTP_PASS:?Set NNTP_PASS in your environment}
      NNTP_CONNECTIONS: ${NNTP_CONNECTIONS:-4}
      NNTP_TIMEOUT: ${NNTP_TIMEOUT:-30s}
      NNTP_CA_FILE: ${NNTP_CA_FILE:-}
      DOWNLOAD_DIR: /downloads
      DOWNLOAD_TIMEOUT: ${DOWNLOAD_TIMEOUT:-2h}
      DB_PATH: /data/nzbunny.db
      RETENTION_TTL: 5m
      CLEANUP_INTERVAL: 30s
      POLL_INTERVAL: 10s
      HTTP_HEADER_TIMEOUT: 15s
      HTTP_REQUEST_TIMEOUT: 5m
      MAX_ARTIFACT_BYTES: "209715200"
      MAX_UPLOAD_BYTES: "2097152"
      MAX_ACTIVE_JOBS: "32"
      MAX_CONNECTIONS: "128"
      UPLOADS_PER_MINUTE: "20"
      TRUSTED_PROXY_CIDRS: ""
    volumes:
      - nzbunny-data:/data
      - downloads:/downloads
    ports:
      - "127.0.0.1:1337:1337"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:1337/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  nzbunny-data:
  downloads:
