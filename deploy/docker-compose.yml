services:
  nzigbunny:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nzigbunny
    environment:
      PORT: "1337"
      SABNZBD_URL: http://sabnzbd:8080
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:?Set SABNZBD_API_KEY in your environment}
      SABNZBD_DOWNLOAD_DIR: /downloads
      DB_PATH: /data/nzigbunny.db
      RETENTION_TTL: 5m
      CLEANUP_INTERVAL: 30s
      POLL_INTERVAL: 10s
      SABNZBD_REQUEST_TIMEOUT: 30s
      HTTP_HEADER_TIMEOUT: 15s
      HTTP_REQUEST_TIMEOUT: 5m
      MAX_ARTIFACT_BYTES: "209715200"
      MAX_UPLOAD_BYTES: "2097152"
      MAX_ACTIVE_JOBS: "32"
      MAX_CONNECTIONS: "128"
      UPLOADS_PER_MINUTE: "20"
      TRUSTED_PROXY_CIDRS: ""
    volumes:
      - nzigbunny-data:/data
      - downloads:/downloads
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      sabnzbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:1337/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd@sha256:302be8972d4627222a0701634f2f9025826d760d856414aa6e67c0a66833e5be
    container_name: nzigbunny-sabnzbd
    hostname: sabnzbd
    environment:
      PUID: "10001"
      PGID: "10001"
      TZ: Etc/UTC
    volumes:
      - sabnzbd-config:/config
      - sabnzbd-incomplete:/incomplete-downloads
      - downloads:/downloads
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api?mode=version\\&output=json || wget -q -O /dev/null http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  nzigbunny-data:
  sabnzbd-config:
  sabnzbd-incomplete:
  downloads:
