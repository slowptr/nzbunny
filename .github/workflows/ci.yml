name: Reliability checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - name: Formatting, unit, integration, and operational regression tests
        run: docker build --target test --build-arg TEST_OPTIMIZE=${{ matrix.optimize }} --progress=plain .
  container:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t nzbunny:test .
      - name: Validate Compose configuration
        env:
          NNTP_HOST: localhost
          NNTP_USER: test
          NNTP_PASS: test
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Run container smoke test
        run: python3 tests/smoke.py
